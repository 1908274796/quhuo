<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>优选资料铺</title>
<style>:root { --bg:#0A0E14; --panel:rgba(17,22,29,.66); --ink:#E6EDF3; --sub:#8B98A5; --line:rgba(148,163,184,.16); --v:#8B5CF6; --c:#22D3EE; --ok:#34D399; --err:#F87171; --mono:ui-monospace,'SF Mono',Consolas,monospace; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { margin:0; min-height:100vh; background:var(--bg); color:var(--ink); font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif; overflow-x:hidden; }
body::before { content:''; position:fixed; inset:0; pointer-events:none; z-index:0; background: radial-gradient(600px 400px at 15% -5%, rgba(139,92,246,.16), transparent 65%), radial-gradient(700px 500px at 90% 110%, rgba(34,211,238,.12), transparent 65%); }
body::after { content:''; position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.35; background-image: linear-gradient(rgba(148,163,184,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(148,163,184,.05) 1px, transparent 1px); background-size: 44px 44px; }
.glass { background:var(--panel); border:1px solid var(--line); border-radius:18px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); box-shadow: 0 8px 32px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.05); }
@keyframes fadeUp { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:none; } }
@keyframes glowShift { 0%,100% { opacity:.5; } 50% { opacity:1; } }
@keyframes shake { 0%,100% { transform:translateX(0); } 25% { transform:translateX(-7px); } 75% { transform:translateX(7px); } }
@keyframes unlockPop { 0% { opacity:0; transform:scale(.94) translateY(10px); } 100% { opacity:1; transform:none; } }
.wrap { padding: 22px 18px 56px; }
.hero { text-align:center; padding: 30px 0 26px; animation: fadeUp .6s ease both; }
.hero .logo-tile { display:inline-flex; width:64px; height:64px; border-radius:20px; align-items:center; justify-content:center;
  font-size:30px; background: linear-gradient(135deg, rgba(139,92,246,.25), rgba(34,211,238,.18));
  border: 1px solid rgba(139,92,246,.35); box-shadow: 0 0 40px rgba(139,92,246,.25); }
.hero h1 { font-size: 25px; font-weight: 800; margin: 14px 0 6px; letter-spacing: .5px;
  background: linear-gradient(120deg, #E6EDF3, #8B5CF6 55%, #22D3EE); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero p { font-size: 13px; color: var(--sub); margin: 0 0 12px; }
.hero .chips { display:flex; gap: 8px; justify-content:center; flex-wrap: wrap; }
.hero .chips span { font-size: 11.5px; color: #A9B7C6; background: rgba(148,163,184,.1); border: 1px solid rgba(148,163,184,.2); border-radius: 20px; padding: 5px 12px; }
.portal { background:var(--panel); border:1px solid var(--line); border-radius:20px; padding:30px 22px; margin-top:4px;
  text-align:center; backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  box-shadow:0 8px 32px rgba(0,0,0,.4); animation:fadeUp .55s ease both; }
.portal-ico { font-size:38px; margin-bottom:8px; }
.portal h2 { font-size:20px; font-weight:800; margin:10px 0 4px; color:#E6EDF3; }
.portal-sub { font-size:12.5px; color:var(--sub); margin:0 0 20px; }
.portal .gate { display:flex; gap:8px; max-width:430px; margin:0 auto; }
.portal .code-input { flex:1; border:1px solid var(--line); border-radius:13px; padding:12px 14px; font-size:16px;
  letter-spacing:3px; background:rgba(10,14,20,.6); color:var(--ink); font-family:var(--mono); text-transform:uppercase; }
.portal .code-input:focus { outline:none; border-color:var(--c); box-shadow:0 0 0 3px rgba(34,211,238,.15), 0 0 24px rgba(34,211,238,.12); }
.portal .btn-unlock { border:none; border-radius:13px; padding:12px 26px; font-size:14.5px; font-weight:800; color:#fff; cursor:pointer;
  background:linear-gradient(135deg, var(--v), #6366F1 55%, var(--c)); box-shadow:0 4px 20px rgba(139,92,246,.35); }
.portal .err { color:var(--err); font-size:12.5px; margin:10px 0 0; min-height:16px; }
footer { text-align:center; font-size: 11px; color: var(--sub); margin-top: 30px; line-height: 1.9; }
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="logo-tile">📦</div>
    <h1>优选资料铺</h1>
    <p>程序员 / 效率 / 家庭 · 精选电子资料</p>
    <div class="chips"><span>✦ 已上架 9 件</span><span>⚡ 自动发货</span><span>🔗 链接永久有效</span></div>
  </div>
  <div class="portal">
    <div class="portal-ico">🔐</div>
    <h2>输入取货码</h2>
    <p class="portal-sub">查看您购买的专属内容</p>
    <div class="gate">
      <input id="code-input" type="text" inputmode="text" autocomplete="off" maxlength="12" placeholder="····" class="code-input" />
      <button id="unlock" class="btn-unlock">解 锁</button>
    </div>
    <p class="err" id="err"></p>
  </div>
  <footer>记录生活，分享美好 · 谢谢光临<br>本站为取货入口，购买请 via 闲鱼</footer>
</div>
<div class="toast" id="toast"></div>
<script>
const MAP = JSON.parse(atob('eyIwY2JiNzY4NTY2ZmZjOWVhMjQwY2NjYjYzMGJmMzAwYzdiMTE2OWEwYTE0ZDI5MGNjM2E3YjU1MTgwOTYwNmI4IjoiamF2YS1ib29rIiwiMTJhMjM5MzQwMzYwNmEyMjY4MTk4YzAzNTJjMjgyMjQxMDc5MWFmZmM2OTRkOTk4M2ViZGI0OWFhZjZmYjI5OSI6ImxpbnV4LWJvb2siLCJiNDQ0YWE3MzE4OTE1MDlkZjIzNmZhM2NiMTA5NjdjZGE3NDg0MDk0MDJiZThlYTE5MjhhMTcxZmRiYjY1OGQ4IjoiY2hlYXRzaGVldC1ib29rIiwiZmE5ZjJlN2NkNjM0ZGU5ZGMyZjdkOTdhYzcwMTNlNmE3NjM0NjI5NmQ1OTZmM2IxNmMzNTRkOWZmMzFmMGZhMiI6InByb21wdHMtYm9vayIsImM4OTg0YzEwZTU2NzRkMzJhNjRiNzU1NjdlYTBjNjU2OGIwYzc3ZDEwNDI3YjAwY2E3OWI3MGVlMmFkOTEyNDUiOiJwb2V0cnktYm9vayIsIjhiY2VmN2M1YzEwYmU2NjA4MzY0MTg0ZTk0ZDBjY2Y4YzJmNDRjN2FhOGM5ZDEyODZhZThkODY3MzU2NzgxYzQiOiJyZWNpcGUtYm9vayIsIjg1MzM3ODE2ZDI2M2QzNjJhY2IyM2E0MjU1YTYzNjE5MTA3NWMyYTkwYzQ3ZjJlZTZkYjMzNjJmN2RmMTEyMDMiOiJwMTc5MTI2NzMwOTgwMCIsIjI4ODkyYTNhMjY1ZmZkOThkZmU2MDI2NWM2MjY2MGNmYzc2MTc3NTFkOGU4MTAzMjU0MWFkYzlkYzM1Yzc1NzciOiJwMTc5MTcxMTE4MDgzNjU5IiwiYTU5OWNmOWI1NzVjODgwZWFmNjM1MzQwM2NjZGU0NTI3ZWQxZDQwZTBmNGI1OGRmNDM1M2ZmZDgyNjJlYzI4ZSI6InAxNzkxNzExMTgwODM3MTEifQ=='));
async function sha256hex(text) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1600);
}
const input = document.getElementById('code-input');
const unlockBtn = document.getElementById('unlock');
let fails = 0, lockTimer = null;
function showErr(msg) { document.getElementById('err').textContent = msg; }
async function tryUnlock() {
  if (lockTimer) return;
  const code = input.value.trim().toLowerCase();
  if (!code) { showErr('请输入取货码'); return; }
  unlockBtn.textContent = '验证中…'; unlockBtn.disabled = true;
  const h = await sha256hex(code);
  unlockBtn.textContent = '解 锁'; unlockBtn.disabled = false;
  const hit = MAP[h];
  if (hit) { location.href = 'detail-' + hit + '.html?code=' + encodeURIComponent(code); return; }
  fails++;
  showErr('取货码不对，请核对后重试（还可试 ' + (5 - fails) + ' 次）');
  if (fails >= 5) {
    let left = 60;
    showErr('错误次数过多，请 ' + left + ' 秒后再试');
    input.disabled = true; unlockBtn.disabled = true;
    lockTimer = setInterval(() => {
      left--;
      if (left <= 0) { clearInterval(lockTimer); lockTimer = null; fails = 0; input.disabled = false; unlockBtn.disabled = false; hideErr(); }
      else showErr('错误次数过多，请 ' + left + ' 秒后再试');
    }, 1000);
  }
}
function hideErr() { document.getElementById('err').textContent = ''; }
unlockBtn.addEventListener('click', () => tryUnlock());
input.addEventListener('keydown', e => { if (e.key === 'Enter') tryUnlock(); });
</script>
</body>
</html>
