<script>
const __pid = new URLSearchParams(location.search).get('p');
if (__pid) {
  setTimeout(() => {

    if (card) {
      card.scrollIntoView({ behavior: 'smooth', block: 'center' });
      card.style.boxShadow = '0 0 0 3px #C96F2B';
      setTimeout(() => card.style.boxShadow = '', 3000);
    }
  }, 400);
}
document.getElementById('search').addEventListener('input', function() {
  const q = this.value.trim().toLowerCase();
  let shown = 0;
  document.querySelectorAll('.card').forEach(c => {
    const hit = !q || c.textContent.toLowerCase().includes(q);
    c.style.display = hit ? '' : 'none';
    if (hit) shown++;
  });
  document.getElementById('nomatch').style.display = shown ? 'none' : 'block';
});
function dec(b) { try { return decodeURIComponent(escape(atob(b))); } catch (e) { return ''; } }
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1600);
}
document.querySelectorAll('.card').forEach(card => {
  const gate = card.querySelector('.gate');
  const input = card.querySelector('.code-input');
  const btn = card.querySelector('.btn-get');
  const result = card.querySelector('.result');
  let fails = 0, lockTimer = null;
  function tryGet() {
    if (lockTimer) { return; }
    if (input.value.trim() === card.dataset.code) {
      result.hidden = false; gate.style.display = 'none';
      result.querySelectorAll('.url-line').forEach(ln => { const e = ln.dataset.encUrl; if (e) ln.textContent = dec(e); });
    } else {
      fails++;
      let err = card.querySelector('.err');
      if (!err) { err = document.createElement('p'); err.className = 'err'; err.style.cssText = 'color:#C0392B;font-size:12.5px;margin:8px 0 0'; gate.after(err); }
      if (fails >= 5) {
        let left = 60;
        err.textContent = '错误次数过多，请 ' + left + ' 秒后再试';
        input.disabled = true; btn.disabled = true;
        lockTimer = setInterval(() => {
          left--;
          if (left <= 0) { clearInterval(lockTimer); lockTimer = null; fails = 0; input.disabled = false; btn.disabled = false; err.textContent = ''; }
          else err.textContent = '错误次数过多，请 ' + left + ' 秒后再试';
        }, 1000);
      } else {
        err.textContent = '验证码不对，请核对后重试（还可试 ' + (5 - fails) + ' 次）';
      }
    }
  }
  btn.addEventListener('click', tryGet);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') tryGet(); });
});
document.addEventListener('click', e => {
  const btn = e.target.closest('.copy');
  if (!btn) return;
  const text = btn.dataset.copy !== undefined ? btn.dataset.copy : dec(btn.dataset.enc || '');
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(() => toast('已复制')).catch(() => fallback(text));
  else fallback(text);
  function fallback(t) {
    const ta = document.createElement('textarea');
    ta.value = t; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('已复制'); } catch (_) { toast('请长按文字手动复制'); }
    ta.remove();
  }
});
</script>
